<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XArchive 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header><p class="eyebrow">XARCHIVE / SETTINGS</p><h1>Extension 设置</h1><p class="subtitle">管理本地 Desktop 连接和配对信息。</p></header>
    <section class="card">
      <div class="card-heading"><div><h2>Desktop 自动连接</h2><p>通过本机 Native Host 自动发现 Desktop，无需填写端口或 token。</p></div><label class="switch"><input id="enabled" type="checkbox" aria-label="启用 Desktop 自动连接"><span></span></label></div>
      <div class="actions"><button class="primary" id="save" type="button">保存并连接</button><button class="secondary" id="reconnect" type="button">重新连接</button></div>
      <p class="message" id="message" role="status"></p>
    </section>
    <section class="card compact"><h2>当前状态</h2><div class="state-line"><span>通信通道</span><strong id="channel">—</strong></div><div class="state-line"><span>WebSocket</span><strong id="websocket">—</strong></div><p class="note">连接失败时请确认 Desktop 已启动且浏览器 Native Host 已注册。</p></section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
