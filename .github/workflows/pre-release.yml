name: Linux Pre-Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Pre-release tag to create"
        required: true
        default: "v0.1.1-pre.4"
        type: string
      release_title:
        description: "GitHub pre-release title"
        required: true
        default: "XArchive v0.1.1-pre.4"
        type: string
      source_ref:
        description: "Branch or commit containing the release source"
        required: true
        default: "feat/extraction-aria2-pipeline"
        type: string

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify Linux and create GitHub pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Install Sidecar test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e sidecar

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust workspace tests
        run: cargo test --workspace --no-fail-fast

      - name: Rust workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Sidecar compile and tests
        run: |
          python -m compileall -q sidecar/src sidecar/tests
          python -m pytest sidecar/tests -q

      - name: Node checks and tests
        run: |
          npm run check
          npm run test --workspace desktop
          npm run test --workspace extension

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pre\.[0-9]+$ ]]; then
            echo "Invalid pre-release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          gh release create "$RELEASE_TAG" \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TITLE" \
            --prerelease \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --repo "$GITHUB_REPOSITORY"