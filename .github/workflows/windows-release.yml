name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to receive the Windows executable"
        required: true
        default: "v0.1.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GALLERY_DL_RELEASE: "2026.09.20"
      ARIA2_RELEASE: "release-1.37.0"
      TAURI_DRIVER_VERSION: "2.1.0-alpha.0"
      EDGEDRIVER_VERSION: "152.0.4191.66"
      XARCHIVE_EXTENSION_ID: ${{ vars.XARCHIVE_EXTENSION_ID || secrets.XARCHIVE_EXTENSION_ID }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify release tag and source parity
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) { throw "RELEASE_TAG is empty" }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Unexpected release tag format: $env:RELEASE_TAG"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and "${{ github.ref_name }}" -ne $env:RELEASE_TAG) {
            throw "Dispatch ref ${{ github.ref_name }} does not match release tag $env:RELEASE_TAG; re-run with gh workflow run windows-release.yml --ref $env:RELEASE_TAG"
          }
          $tagSha = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagSha)) {
            throw "Release tag was not found: $env:RELEASE_TAG"
          }
          $headSha = (git rev-parse HEAD).Trim()
          Write-Host "Release tag:  $env:RELEASE_TAG ($tagSha)"
          Write-Host "Checked out:  $headSha"
          Write-Host "Workflow sha: ${{ github.sha }}"
          if ($headSha -ne $tagSha) {
            throw "Release source mismatch: checked out $headSha but tag $env:RELEASE_TAG points at $tagSha"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and "${{ github.sha }}" -ne $tagSha) {
            throw "Push event mismatch: workflow sha ${{ github.sha }} vs tag $tagSha"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Check Rust workspace
        shell: pwsh
        run: cargo check --workspace

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --workspace

      - name: Build Windows Tauri executable
        shell: pwsh
        run: npm run build:tauri --workspace desktop

      - name: Prepare pinned WebDriver toolchain
        shell: pwsh
        run: |
          $driverRoot = Join-Path $env:RUNNER_TEMP "xarchive-webdriver-tools"
          $tauriRoot = Join-Path $driverRoot "tauri-driver"
          New-Item -ItemType Directory -Path $tauriRoot -Force | Out-Null
          cargo install tauri-driver --version $env:TAURI_DRIVER_VERSION --locked --root $tauriRoot
          $tauriPath = Join-Path $tauriRoot "bin"
          if (-not (Test-Path (Join-Path $tauriPath "tauri-driver.exe"))) {
            throw "Pinned tauri-driver was not installed: $tauriPath"
          }
          $edgeCommand = Get-Command msedgedriver.exe -ErrorAction SilentlyContinue
          if ($null -eq $edgeCommand) {
            throw "Pinned msedgedriver $env:EDGEDRIVER_VERSION was not found on PATH"
          }
          $edgeVersion = (& $edgeCommand.Source --version 2>&1 | Out-String).Trim()
          if ($edgeVersion -notmatch [regex]::Escape($env:EDGEDRIVER_VERSION)) {
            throw "msedgedriver version mismatch: expected $env:EDGEDRIVER_VERSION, got $edgeVersion"
          }
          "$tauriPath" >> $env:GITHUB_PATH
          "TAURI_DRIVER_PATH=$tauriPath" >> $env:GITHUB_ENV
          "MS_EDGE_DRIVER_PATH=$($edgeCommand.Source)" >> $env:GITHUB_ENV
          "TAURI_DRIVER_AUTO_INSTALL=0" >> $env:GITHUB_ENV
          "EDGE_DRIVER_AUTO_DOWNLOAD=0" >> $env:GITHUB_ENV
          Get-FileHash (Join-Path $tauriPath "tauri-driver.exe") -Algorithm SHA256 | ConvertTo-Json | Out-File (Join-Path $driverRoot "tauri-driver.sha256.json") -Encoding utf8
          Get-FileHash $edgeCommand.Source -Algorithm SHA256 | ConvertTo-Json | Out-File (Join-Path $driverRoot "msedgedriver.sha256.json") -Encoding utf8
          @{
            tauri_driver_version = $env:TAURI_DRIVER_VERSION
            tauri_driver_path = (Join-Path $tauriPath "tauri-driver.exe")
            msedgedriver_version = $env:EDGEDRIVER_VERSION
            msedgedriver_path = $edgeCommand.Source
            msedgedriver_reported_version = $edgeVersion
          } | ConvertTo-Json | Out-File (Join-Path $driverRoot "toolchain.json") -Encoding utf8

      - name: Build Native Messaging Host
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:XARCHIVE_EXTENSION_ID)) {
            throw "XARCHIVE_EXTENSION_ID repository variable (or secret) is required before publishing Windows Native Host assets"
          }
          if ($env:XARCHIVE_EXTENSION_ID -notmatch '^[a-p]{32}$') {
            throw "XARCHIVE_EXTENSION_ID must be a 32-character Chromium Extension ID using only characters a-p"
          }
          node (Join-Path $env:GITHUB_WORKSPACE "desktop\scripts\extension-identity.mjs") verify --extension-dir (Join-Path $env:GITHUB_WORKSPACE "extension") --expected-id $env:XARCHIVE_EXTENSION_ID
          if ($LASTEXITCODE -ne 0) {
            throw "Extension manifest key does not match XARCHIVE_EXTENSION_ID"
          }
          cargo build -p xarchive-native-host --release
          $hostBinary = "target\release\xarchive-native-host.exe"
          if (-not (Test-Path $hostBinary)) { throw "Expected Native Host artifact was not generated: $hostBinary" }

      - name: Build Windows worker
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e sidecar
          python -m pip install pyinstaller
          Remove-Item sidecar\build,sidecar\dist -Recurse -Force -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean `
            --distpath sidecar\dist `
            --workpath sidecar\build `
            sidecar\pyinstaller\xarchive-downloader.spec
          $worker = "sidecar\dist\xarchive-downloader\xarchive-downloader.exe"
          if (-not (Test-Path $worker)) { throw "Expected worker artifact was not generated: $worker" }
          $runtime = Join-Path (Split-Path $worker) "_internal\python312.dll"
          if (-not (Test-Path $runtime)) { throw "Expected worker runtime was not generated: $runtime" }
          & $worker --help
          if ($LASTEXITCODE -ne 0) { throw "Worker smoke check failed with exit code $LASTEXITCODE" }

      - name: Download official external dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $external = Join-Path $env:RUNNER_TEMP "xarchive-external"
          Remove-Item $external -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $external | Out-Null

          $galleryUrl = "https://github.com/gdl-org/builds/releases/download/$env:GALLERY_DL_RELEASE/gallery-dl_windows.exe"
          $galleryPath = Join-Path $external "gallery-dl.exe"
          Invoke-WebRequest -Uri $galleryUrl -OutFile $galleryPath
          if (-not (Test-Path $galleryPath)) { throw "gallery-dl download failed" }
          & $galleryPath --version
          if ($LASTEXITCODE -ne 0) { throw "gallery-dl smoke check failed with exit code $LASTEXITCODE" }

          $ariaArchive = Join-Path $external "aria2.zip"
          $ariaUrl = "https://github.com/aria2/aria2/releases/download/$env:ARIA2_RELEASE/aria2-1.37.0-win-64bit-build1.zip"
          Invoke-WebRequest -Uri $ariaUrl -OutFile $ariaArchive
          $ariaExtract = Join-Path $external "aria2-extracted"
          Expand-Archive -Path $ariaArchive -DestinationPath $ariaExtract -Force
          $ariaExe = Get-ChildItem $ariaExtract -Filter aria2c.exe -Recurse | Select-Object -First 1
          if ($null -eq $ariaExe) { throw "aria2c.exe was not found in official archive" }
          & $ariaExe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "aria2 smoke check failed with exit code $LASTEXITCODE" }

          "GALLERY_DL_URL=$galleryUrl" | Out-File -FilePath (Join-Path $external "sources.txt") -Encoding utf8
          "ARIA2_URL=$ariaUrl" | Out-File -FilePath (Join-Path $external "sources.txt") -Append -Encoding utf8
          "gallery=$galleryPath" >> $env:GITHUB_OUTPUT
          "aria=$($ariaExe.FullName)" >> $env:GITHUB_OUTPUT
          "external=$external" >> $env:GITHUB_OUTPUT

      - name: Collect executable
        id: collect
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "target\release\xarchive-desktop.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not generated: $exe"
          }

          $versioned = Join-Path $env:GITHUB_WORKSPACE "XArchive-$env:RELEASE_TAG-windows-x64.exe"
          Copy-Item $exe $versioned -Force
          "asset=$versioned" >> $env:GITHUB_OUTPUT

      - name: Windows UI readiness preflight
        shell: pwsh
        env:
          WDIO_APP_BINARY: ${{ steps.collect.outputs.asset }}
          READINESS_DIAGNOSTICS: ${{ runner.temp }}\xarchive-release-readiness
        run: |
          Remove-Item $env:READINESS_DIAGNOSTICS -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:READINESS_DIAGNOSTICS | Out-Null
          & pwsh -NoProfile -NonInteractive -File (Join-Path $env:GITHUB_WORKSPACE "desktop\scripts\windows-ui-readiness-preflight.ps1") `
            -Executable $env:WDIO_APP_BINARY `
            -OutputDirectory $env:READINESS_DIAGNOSTICS
          if ($LASTEXITCODE -ne 0) {
            throw "Windows UI readiness preflight failed with exit code $LASTEXITCODE"
          }

      - name: Run final executable UI readiness gate
        id: ui_readiness
        shell: pwsh
        env:
          WDIO_APP_BINARY: ${{ steps.collect.outputs.asset }}
          WDIO_CAPTURE_LOGS: "1"
          WDIO_LOG_DIR: ${{ runner.temp }}\xarchive-release-readiness
          READINESS_DIAGNOSTICS: ${{ runner.temp }}\xarchive-release-readiness
          TAURI_DRIVER_PROVIDER: external
          WDIO_AUTO_INSTALL_TAURI_DRIVER: "0"
          WDIO_AUTO_DOWNLOAD_EDGE_DRIVER: "0"
          EDGEDRIVER_VERSION: ${{ env.EDGEDRIVER_VERSION }}
        run: |
          New-Item -ItemType Directory -Path $env:WDIO_LOG_DIR | Out-Null
          $exitCode = 0
          try {
            npm run test:e2e:windows --workspace desktop
            $exitCode = $LASTEXITCODE
          } finally {
            Copy-Item (Join-Path $env:RUNNER_TEMP "xarchive-webdriver-tools") (Join-Path $env:READINESS_DIAGNOSTICS "webdriver-tools") -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE "desktop\logs") (Join-Path $env:READINESS_DIAGNOSTICS "desktop-logs") -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE "desktop\test-artifacts") (Join-Path $env:READINESS_DIAGNOSTICS "test-artifacts") -Recurse -Force -ErrorAction SilentlyContinue
            Get-Process xarchive-desktop, msedgewebview2, tauri-driver, msedgedriver -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, Path | Out-File (Join-Path $env:READINESS_DIAGNOSTICS "processes-after-wdio.txt") -Encoding utf8
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 1420, 4444, 4445, 9223 } | Select-Object LocalAddress, LocalPort, OwningProcess | Out-File (Join-Path $env:READINESS_DIAGNOSTICS "ports-after-wdio.txt") -Encoding utf8
          }
          if ($exitCode -ne 0) {
            throw "Final executable UI readiness gate failed with exit code $exitCode"
          }

      - name: Upload UI readiness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XArchive-${{ env.RELEASE_TAG }}-ui-readiness-diagnostics
          path: ${{ runner.temp }}\xarchive-release-readiness
          if-no-files-found: warn
          retention-days: 30

      - name: Create application-only 7z archive
        id: archive
        shell: pwsh
        run: |
          $exe = [System.IO.Path]::GetFullPath("${{ steps.collect.outputs.asset }}")
          $archive = Join-Path $env:GITHUB_WORKSPACE "XArchive-$env:RELEASE_TAG-windows-x64.7z"
          $staging = Join-Path $env:RUNNER_TEMP "xarchive-7z-content"
          $stagedExe = Join-Path $staging "xarchive-desktop.exe"

          Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item $exe $stagedExe -Force

          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if ($null -eq $sevenZip) {
            $sevenZipPath = Join-Path ${env:ProgramFiles} "7-Zip\7z.exe"
            if (-not (Test-Path $sevenZipPath)) {
              throw "7-Zip executable was not found"
            }
            $sevenZip = $sevenZipPath
          } else {
            $sevenZip = $sevenZip.Source
          }

          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          & $sevenZip a -t7z -mx=9 $archive (Join-Path $staging "xarchive-desktop.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip archive creation failed with exit code $LASTEXITCODE"
          }

          $listing = & $sevenZip l -slt $archive
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip archive listing failed with exit code $LASTEXITCODE"
          }

          $entries = @(
            $listing |
              Select-String '^Path = (.+)$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } |
              Where-Object { $_ -ne $archive }
          )
          if ($entries.Count -ne 1 -or $entries[0] -ne "xarchive-desktop.exe") {
            $entries | ForEach-Object { Write-Host "Unexpected archive entry: $_" }
            throw "7z archive must contain exactly xarchive-desktop.exe"
          }

          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Create repository dependencies archive
        id: repository_dependencies
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "xarchive-repository-dependencies"
          $workerSource = Join-Path $env:GITHUB_WORKSPACE "sidecar\dist\xarchive-downloader"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $root "sidecar") | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "extension") (Join-Path $root "extension") -Recurse -Force
          New-Item -ItemType Directory -Path (Join-Path $root "native-host") -Force | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "target\release\xarchive-native-host.exe") (Join-Path $root "native-host\xarchive-native-host.exe") -Force
          node (Join-Path $env:GITHUB_WORKSPACE "desktop\scripts\native-host-manifest-cli.mjs") --extension-dir (Join-Path $env:GITHUB_WORKSPACE "extension") --expected-id $env:XARCHIVE_EXTENSION_ID --host-executable (Join-Path $root "native-host\xarchive-native-host.exe") --output (Join-Path $root "native-host\com.tw2tg.xarchive.json")
          if ($LASTEXITCODE -ne 0) {
            throw "Native Host manifest generation failed for repository dependencies archive"
          }
          Copy-Item $workerSource (Join-Path $root "sidecar\xarchive-downloader") -Recurse -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "LICENSE") $root -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "THIRD_PARTY_NOTICES.md") $root -Force
          $manifest = @{
            schema_version = 1
            package_type = "repository-dependencies"
            platform = "windows-x64"
            release_tag = $env:RELEASE_TAG
            contents = @("extension", "native-host/xarchive-native-host.exe", "native-host/com.tw2tg.xarchive.json", "sidecar/xarchive-downloader")
            external_dependencies = @("gallery-dl", "aria2")
          } | ConvertTo-Json -Depth 4
          $manifest | Out-File (Join-Path $root "package-manifest.json") -Encoding utf8
          $archive = Join-Path $env:GITHUB_WORKSPACE "XArchive-$env:RELEASE_TAG-windows-x64-repository-dependencies.7z"
          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if ($null -eq $sevenZip) {
            $sevenZipPath = Join-Path ${env:ProgramFiles} "7-Zip\7z.exe"
            if (-not (Test-Path $sevenZipPath)) { throw "7-Zip executable was not found" }
            $sevenZip = $sevenZipPath
          } else { $sevenZip = $sevenZip.Source }
          & $sevenZip a -t7z -mx=9 $archive (Join-Path $root "*")
          if ($LASTEXITCODE -ne 0) { throw "Repository dependency archive creation failed" }
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Create full bundle 7z archive
        id: full_bundle
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "xarchive-full-bundle"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root | Out-Null
          Copy-Item "${{ steps.collect.outputs.asset }}" (Join-Path $root "xarchive-desktop.exe") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "extension") (Join-Path $root "extension") -Recurse -Force
          New-Item -ItemType Directory -Path (Join-Path $root "native-host") -Force | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "target\release\xarchive-native-host.exe") (Join-Path $root "native-host\xarchive-native-host.exe") -Force
          node (Join-Path $env:GITHUB_WORKSPACE "desktop\scripts\native-host-manifest-cli.mjs") --extension-dir (Join-Path $env:GITHUB_WORKSPACE "extension") --expected-id $env:XARCHIVE_EXTENSION_ID --host-executable (Join-Path $root "native-host\xarchive-native-host.exe") --output (Join-Path $root "native-host\com.tw2tg.xarchive.json")
          if ($LASTEXITCODE -ne 0) {
            throw "Native Host manifest generation failed for full bundle"
          }
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "sidecar\dist\xarchive-downloader") (Join-Path $root "sidecar\xarchive-downloader") -Recurse -Force
          $external = Join-Path $env:RUNNER_TEMP "xarchive-external"
          New-Item -ItemType Directory -Path (Join-Path $root "sidecar\gallery-dl"), (Join-Path $root "sidecar\aria2") -Force | Out-Null
          Copy-Item (Join-Path $external "gallery-dl.exe") (Join-Path $root "sidecar\gallery-dl\gallery-dl.exe") -Force
          $ariaExe = Get-ChildItem $external -Filter aria2c.exe -Recurse | Select-Object -First 1
          Copy-Item $ariaExe.FullName (Join-Path $root "sidecar\aria2\aria2c.exe") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "LICENSE") $root -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "THIRD_PARTY_NOTICES.md") $root -Force
          $manifest = @{
            schema_version = 1
            package_type = "full"
            platform = "windows-x64"
            release_tag = $env:RELEASE_TAG
            desktop = "xarchive-desktop.exe"
            repository_dependencies = @("extension", "native-host/xarchive-native-host.exe", "native-host/com.tw2tg.xarchive.json", "sidecar/xarchive-downloader")
            external_dependencies = @{
              gallery_dl = @{ version = $env:GALLERY_DL_RELEASE; path = "sidecar/gallery-dl/gallery-dl.exe"; source = "gdl-org/builds" }
              aria2 = @{ version = $env:ARIA2_RELEASE; path = "sidecar/aria2/aria2c.exe"; source = "aria2/aria2" }
            }
          } | ConvertTo-Json -Depth 6
          $manifest | Out-File (Join-Path $root "package-manifest.json") -Encoding utf8
          $archive = Join-Path $env:GITHUB_WORKSPACE "XArchive-$env:RELEASE_TAG-windows-x64-full.7z"
          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if ($null -eq $sevenZip) {
            $sevenZipPath = Join-Path ${env:ProgramFiles} "7-Zip\7z.exe"
            if (-not (Test-Path $sevenZipPath)) { throw "7-Zip executable was not found" }
            $sevenZip = $sevenZipPath
          } else { $sevenZip = $sevenZip.Source }
          & $sevenZip a -t7z -mx=9 $archive (Join-Path $root "*")
          if ($LASTEXITCODE -ne 0) { throw "Full bundle archive creation failed" }
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Create Extension ZIP package
        id: extension_package
        shell: pwsh
        run: |
          $extensionRoot = Join-Path $env:GITHUB_WORKSPACE "extension"
          $planPath = Join-Path $env:RUNNER_TEMP "xarchive-extension-package.json"
          node (Join-Path $env:GITHUB_WORKSPACE "desktop\scripts\extension-package.mjs") plan --extension-dir $extensionRoot --extension-id $env:XARCHIVE_EXTENSION_ID --tag $env:RELEASE_TAG --output $planPath
          if ($LASTEXITCODE -ne 0) { throw "Extension package plan failed" }

          $plan = Get-Content $planPath -Raw | ConvertFrom-Json
          $staging = Join-Path $env:RUNNER_TEMP "xarchive-extension-staging"
          Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging | Out-Null
          foreach ($file in $plan.files) {
            $target = Join-Path $staging $file
            $targetDirectory = Split-Path $target
            New-Item -ItemType Directory -Path $targetDirectory -Force | Out-Null
            Copy-Item (Join-Path $extensionRoot $file) $target -Force
          }

          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if ($null -eq $sevenZip) {
            $sevenZipPath = Join-Path ${env:ProgramFiles} "7-Zip\7z.exe"
            if (-not (Test-Path $sevenZipPath)) { throw "7-Zip executable was not found" }
            $sevenZip = $sevenZipPath
          } else { $sevenZip = $sevenZip.Source }

          $archive = Join-Path $env:GITHUB_WORKSPACE "XArchive-$env:RELEASE_TAG-extension.zip"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          & $sevenZip a -tzip -mx=9 $archive (Join-Path $staging "*")
          if ($LASTEXITCODE -ne 0) { throw "Extension ZIP creation failed" }

          $verifyRoot = Join-Path $env:RUNNER_TEMP "xarchive-extension-verify"
          Remove-Item $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $archive -DestinationPath $verifyRoot -Force
          node (Join-Path $env:GITHUB_WORKSPACE "desktop\scripts\extension-package.mjs") verify --extension-dir $verifyRoot --metadata $planPath
          if ($LASTEXITCODE -ne 0) { throw "Extension ZIP inventory verification failed" }

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $archive).Length
          Write-Host "Extension ZIP: $archive ($size bytes, sha256 $hash)"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT

      - name: Create and verify release manifest
        id: release_manifest
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:RUNNER_TEMP "XArchive-$env:RELEASE_TAG-release-manifest.json"
          $sumsPath = Join-Path $env:GITHUB_WORKSPACE "SHA256SUMS-$env:RELEASE_TAG.txt"
          $sourceSha = (git rev-parse HEAD).Trim()
          node (Join-Path $env:GITHUB_WORKSPACE "desktop\scripts\release-manifest-cli.mjs") `
            --tag $env:RELEASE_TAG `
            --executable "${{ steps.collect.outputs.asset }}" `
            --archive "${{ steps.archive.outputs.archive }}" `
            --repository-dependencies "${{ steps.repository_dependencies.outputs.archive }}" `
            --full "${{ steps.full_bundle.outputs.archive }}" `
            --extension "${{ steps.extension_package.outputs.archive }}" `
            --source-sha $sourceSha `
            --extension-id $env:XARCHIVE_EXTENSION_ID `
            --output $manifestPath `
            --sha256sums $sumsPath
          if ($LASTEXITCODE -ne 0) { throw "Release manifest verification failed" }
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT
          "sha256sums=$sumsPath" >> $env:GITHUB_OUTPUT

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: XArchive-${{ env.RELEASE_TAG }}-windows-x64
          path: ${{ steps.collect.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload 7z artifact
        uses: actions/upload-artifact@v4
        with:
          name: XArchive-${{ env.RELEASE_TAG }}-windows-x64-7z
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload repository dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: XArchive-${{ env.RELEASE_TAG }}-windows-x64-repository-dependencies
          path: ${{ steps.repository_dependencies.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload full bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: XArchive-${{ env.RELEASE_TAG }}-windows-x64-full
          path: ${{ steps.full_bundle.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Extension ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: XArchive-${{ env.RELEASE_TAG }}-extension
          path: ${{ steps.extension_package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: XArchive-${{ env.RELEASE_TAG }}-release-metadata
          path: |
            ${{ steps.release_manifest.outputs.manifest }}
            ${{ steps.release_manifest.outputs.sha256sums }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload executable to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG ${{ steps.collect.outputs.asset }} --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload 7z archive to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG ${{ steps.archive.outputs.archive }} --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload repository dependency archive to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG ${{ steps.repository_dependencies.outputs.archive }} --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload full bundle archive to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG ${{ steps.full_bundle.outputs.archive }} --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload Extension ZIP to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG ${{ steps.extension_package.outputs.archive }} --repo $env:GITHUB_REPOSITORY --clobber
          Write-Host "Extension ZIP sha256: ${{ steps.extension_package.outputs.sha256 }} (${{ steps.extension_package.outputs.size }} bytes)"

      - name: Upload release manifest to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG ${{ steps.release_manifest.outputs.manifest }} ${{ steps.release_manifest.outputs.sha256sums }} --repo $env:GITHUB_REPOSITORY --clobber