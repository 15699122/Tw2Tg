[package]
name = "xarchive-telegram"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Telegram Bot API contracts and local formatting primitives"

[dependencies]
bytes = "1"
futures-core = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["fs", "macros", "rt", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[lints]
workspace = true
