[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xarchive-downloader"
version = "0.1.0"
description = "JSONL extraction sidecar for XArchive"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema>=4.20",
    "mypy>=1.13",
    "pytest>=9",
    "ruff>=0.8",
]

[project.scripts]
xarchive-downloader = "xarchive_downloader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true